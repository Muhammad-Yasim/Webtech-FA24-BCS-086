<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="checkout.css">
</head>
<body>

<main class="checkout-page">
    <h1>Checkout</h1>

    <form class="checkout-form">
        <fieldset>
            <legend>Contact</legend>

            <div class="form-field">
                <label for="full-name">Full name</label>
                <input type="text" id="full-name" name="full-name"
                       autocomplete="name" required>
                <small class="error-message">Please enter your full name.</small>
            </div>

            <div class="form-field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       autocomplete="email" required>
                <small class="error-message">Please enter a valid email.</small>
            </div>

            <div class="form-field">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone"
                       pattern="03[0-9]{2}-[0-9]{7}"
                       placeholder="03XX-XXXXXXX"
                       required>
                <small class="error-message">Use format 03XX-XXXXXXX.</small>
            </div>
        </fieldset>

        <fieldset>
            <legend>Delivery</legend>

            <div class="form-field">
                <label for="address">Address</label>
                <input type="text" id="address" name="address"
                       autocomplete="street-address" required>
                <small class="error-message">Please enter your address.</small>
            </div>

            <div class="form-field">
                <label for="city">City</label>
                <select id="city" name="city" required>
                    <option value="">Select a city</option>
                    <option value="islamabad">Islamabad</option>
                    <option value="lahore">Lahore</option>
                    <option value="karachi">Karachi</option>
                    <option value="rawalpindi">Rawalpindi</option>
                    <option value="peshawar">Peshawar</option>
                </select>
                <small class="error-message">Please select a city.</small>
            </div>

            <div class="form-field">
                <label for="delivery-date">Delivery date</label>
                <input type="date" id="delivery-date" name="delivery-date"
                       min="2026-10-29" max="2027-01-23" required>
                <small class="error-message">
                    Choose a date between 29 October 2026 and 23 January 2027.
                </small>
            </div>
        </fieldset>

        <button type="submit">PLACE ORDER</button>
    </form>
</main>

</body>
</html>
